name: Flutter Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.3"
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          flutter build windows --release *>&1 | Tee-Object -FilePath dist/windows_build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed with exit code $LASTEXITCODE"
            Get-Content dist/windows_build.log -Tail 120
            exit $LASTEXITCODE
          }

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-build-log
          path: dist/windows_build.log
          if-no-files-found: ignore

      - name: Download runtime prerequisites
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/prerequisites | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "dist/prerequisites/MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "dist/prerequisites/vc_redist.x64.exe"

      - name: Package distributable folder
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $dest = "dist/injast_admin_windows"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force "$src/*" $dest
          Copy-Item -Force "tool/windows_release/INSTALL_FA.txt" $dest
          Copy-Item -Force "tool/windows_release/install_prerequisites.bat" $dest
          Copy-Item -Force "tool/windows_release/START_injast_admin.bat" $dest
          New-Item -ItemType Directory -Force -Path "$dest/prerequisites" | Out-Null
          Copy-Item -Force "dist/prerequisites/*" "$dest/prerequisites/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: dist/injast_admin_windows/
